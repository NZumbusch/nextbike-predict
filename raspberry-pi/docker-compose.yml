# nextbike-predict auf dem Raspberry Pi
#   docker compose up -d --build      starten
#   docker compose logs -f collector  Sammler-Log
# Web-GUI: http://<ip-des-pi>:8080
name: nextbike

x-app: &app
  build: .
  image: nextbike-predict:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./data:/data
    - ./config.toml:/app/config.toml:ro
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }   # SD-Karte schonen

services:
  collector:
    <<: *app
    command: ["python", "-m", "nextbike.collector"]
    stop_grace_period: 2m          # laufendes Backup sauber beenden
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('/data/heartbeat') > 600)"]
      interval: 2m
      timeout: 10s
      start_period: 2m

  web:
    <<: *app
    command: ["python", "-m", "nextbike.web"]
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on: [collector]

  # Lädt die täglichen Backups (data/backups) per rclone hoch, z. B. zu Google Drive.
  # Einrichtung einmalig: siehe README → "Backups zu Google Drive".
  backup:
    image: rclone/rclone:1.68.2
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "/scripts/rclone-loop.sh"]
    volumes:
      - ./data/backups:/backups
      - ./rclone:/config/rclone
      - ./backup/rclone-loop.sh:/scripts/rclone-loop.sh:ro
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }
